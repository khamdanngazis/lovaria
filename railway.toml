# Railway config-as-code. Service ini + plugin Postgres (DATABASE_URL di-inject dari Postgres service).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migration dijalankan sebelum versi baru menerima trafik; gagal → deploy dibatalkan.
preDeployCommand = ["lovoria migrate up"]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
