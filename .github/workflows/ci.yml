name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lovoria
          POSTGRES_PASSWORD: lovoria
          POSTGRES_DB: lovoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovoria"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://lovoria:lovoria@localhost:5432/lovoria?sslmode=disable
      LOVORIA_REQUIRE_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: templ/sqlc generate check
        run: make generate-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint tenant
        run: make lint-tenant

      - name: Test (unit + integration)
        run: go test -race -count=1 ./...

      - name: Migration up/down/up via binary
        env:
          DATABASE_URL: postgres://lovoria:lovoria@localhost:5432/lovoria?sslmode=disable
          APP_ENV: test
        run: |
          go build -o /tmp/lovoria ./cmd/server
          /tmp/lovoria migrate up
          /tmp/lovoria migrate status
          while [ "$(/tmp/lovoria migrate version | grep -o '[0-9]*$')" != "0" ]; do /tmp/lovoria migrate down; done
          /tmp/lovoria migrate up

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lovoria:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size < 50MB
        run: |
          size=$(docker image inspect lovoria:ci --format '{{.Size}}')
          echo "image size: $((size/1024/1024)) MB"
          test "$size" -lt $((50*1024*1024))
      - name: Smoke test /healthz
        run: |
          docker run -d --name app -p 8080:8080 -e DATABASE_URL=postgres://x:y@127.0.0.1:1/x lovoria:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
