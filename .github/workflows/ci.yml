name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lovoria
          POSTGRES_PASSWORD: lovoria
          POSTGRES_DB: lovoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovoria"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://lovoria:lovoria@localhost:5432/lovoria?sslmode=disable
      LOVORIA_REQUIRE_DB_TESTS: "true"
      # Test backup/restore wajib jalan (butuh pg_dump versi = server).
      LOVORIA_REQUIRE_PG_DUMP: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: PostgreSQL client 16 (pg_dump/pg_restore untuk test backup)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: templ/sqlc generate check
        run: make generate-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint tenant
        run: make lint-tenant

      - name: govulncheck (kerentanan dependency yang benar-benar terpanggil)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Test (unit + integration)
        run: go test -race -count=1 ./...

      - name: Migration up/down/up via binary
        env:
          DATABASE_URL: postgres://lovoria:lovoria@localhost:5432/lovoria?sslmode=disable
          APP_ENV: test
        run: |
          go build -o /tmp/lovoria ./cmd/server
          /tmp/lovoria migrate up
          /tmp/lovoria migrate status
          while [ "$(/tmp/lovoria migrate version | grep -o '[0-9]*$')" != "0" ]; do /tmp/lovoria migrate down; done
          /tmp/lovoria migrate up

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  # E2E smoke test (T17): aplikasi asli + Postgres + Playwright (Chromium, ponsel).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lovoria
          POSTGRES_PASSWORD: lovoria
          POSTGRES_DB: lovoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovoria"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lovoria:lovoria@localhost:5432/lovoria?sslmode=disable
      APP_ENV: development
      PORT: "8080"
      BASE_URL: http://localhost:8080
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/lovoria-media
      PAYMENT_GATEWAY: fake # gateway simulasi (T23) — ditolak di production
      APP_SECRET: e2e-ci-secret-e2e-ci-secret-e2e-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build app & CSS
        run: |
          make css
          go build -o /tmp/lovoria ./cmd/server
          /tmp/lovoria migrate up
      - name: Start app
        run: |
          nohup /tmp/lovoria serve > /tmp/lovoria.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          cat /tmp/lovoria.log; exit 1
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload report & log (gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            /tmp/lovoria.log

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lovoria:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size < 50MB
        run: |
          size=$(docker image inspect lovoria:ci --format '{{.Size}}')
          echo "image size: $((size/1024/1024)) MB"
          test "$size" -lt $((50*1024*1024))
      - name: Smoke test /healthz
        run: |
          docker run -d --name app -p 8080:8080 \
            -e DATABASE_URL=postgres://x:y@127.0.0.1:1/x \
            -e STORAGE_DRIVER=r2 -e R2_ACCOUNT_ID=ci -e R2_ACCESS_KEY_ID=ci -e R2_SECRET_ACCESS_KEY=ci \
            -e R2_BUCKET=ci -e R2_PUBLIC_URL=https://media.example.com \
            lovoria:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
